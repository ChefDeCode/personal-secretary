# 打 v* 标签时（或在 Actions 页面手动运行并填版本号时）：从源码编译 → 打安装包 → 连同 SHA256SUMS 放进 GitHub Release。只做这三件事，不跑测试
# 权限只有 contents: write；只用 GitHub 自带的 GITHUB_TOKEN，不用别的 secret
name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without the leading v, e.g. 0.2.0 (creates tag v<version> on this commit)'
        required: true
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    env:
      INPUT_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2 (pinned by commit)

      - name: Work out the version and tag
        shell: powershell
        run: |
          $tag = if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') { 'v' + $env:INPUT_VERSION } else { $env:GITHUB_REF_NAME }
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') { throw "bad version tag: $tag" }
          "TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # Windows PowerShell 5.1 reads a .ps1 without BOM in the system code page, which garbles Chinese text and can break parsing
      - name: Parse-check every .ps1 with Windows PowerShell 5.1
        shell: powershell
        run: |
          $bad = 0
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $errs = $null; [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errs)
            if ($errs) { $bad++; "PARSE ERROR: $($_.FullName)"; $errs | Select-Object -First 3 | ForEach-Object { "  $($_.Extent.StartLineNumber): $($_.Message)" } }
          }
          if ($bad) { throw "$bad file(s) failed to parse" }
          "all .ps1 files parse"

      - name: Build from source (csc from .NET Framework; WebView2 SDK from nuget.org, SHA256-pinned)
        shell: powershell
        run: .\build.ps1 -FetchWebView2

      # Inno Setup 6 has been listed in the windows-2022 runner image software list
      # (https://github.com/actions/runner-images/blob/main/images/windows/Windows2022-Readme.md).
      # windows-latest may move to an image without it, so install it from Chocolatey when ISCC.exe is missing.
      - name: Make sure Inno Setup is available
        shell: powershell
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; if ($LASTEXITCODE) { exit 1 } }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found after install" }
          "ISCC=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build installer
        shell: powershell
        run: |
          $ver = $env:TAG.TrimStart('v')
          & $env:ISCC "/DAppVersion=$ver" installer\secretary.iss
          if ($LASTEXITCODE) { exit 1 }
          # hash first, then write: piping straight into Out-File opens SHA256SUMS while the folder is still being listed
          $files = @(Get-ChildItem dist -File | Where-Object Name -ne 'SHA256SUMS')
          if (-not $files.Count) { throw 'no installer in dist' }
          $lines = $files | ForEach-Object { '{0}  {1}' -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name }
          [IO.File]::WriteAllText((Join-Path (Resolve-Path dist) 'SHA256SUMS'), (($lines -join "`n") + "`n"), (New-Object Text.UTF8Encoding $false))
          Get-Content dist\SHA256SUMS

      - name: Create GitHub Release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Chinese text lives in UTF-8 files, not in this inline script, so the code page of the runner never matters
          $title = 'Personal Secretary ' + $env:TAG
          gh release create $env:TAG (Get-ChildItem dist -File).FullName --target $env:GITHUB_SHA --title $title --notes-file installer\release-notes.md
          if ($LASTEXITCODE) { exit 1 }